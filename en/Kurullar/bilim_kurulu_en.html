<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symposium Scientific Committee</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

        /* Sadece bu alana etki edecek kapsayıcı kurallar */
        .v-committee-wrapper {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 15px;
            font-family: 'Montserrat', sans-serif;
            background-color: transparent;
        }

        /* Tüm iç elemanları dış temadan korumak için box-sizing ayarı */
        .v-committee-wrapper *, .v-committee-wrapper *::before, .v-committee-wrapper *::after {
            box-sizing: border-box !important;
        }

        /* Grup Başlıkları (Prof, Doç vs.) */
        .v-group-title {
            font-family: 'Playfair Display', serif !important;
            font-size: 1.8rem !important;
            color: #1E5631 !important; /* Koyu Yeşil */
            border-bottom: 2px solid #e2e8f0 !important;
            padding-bottom: 10px !important;
            margin: 50px 0 25px 0 !important;
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
        }

        .v-group-title::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #4C9A2A; /* Açık Yeşil Nokta */
            border-radius: 50%;
        }

        /* Izgara (Grid) Yapısı */
        .v-grid-layout {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)) !important;
            gap: 25px !important; 
            align-items: stretch !important; 
        }

        /* Kart Tasarımı */
        .v-member-card {
            background-color: #ffffff !important;
            border-radius: 8px !important;
            padding: 20px 25px !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05) !important;
            border-left: 4px solid #1E5631 !important; /* Koyu Yeşil */
            transition: all 0.3s ease !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            position: relative !important;
            float: none !important;
            margin: 0 !important;
            height: auto !important;
            min-height: 100px;
            word-wrap: break-word;
        }

        /* Hover (Üzerine gelme) Durumu */
        .v-member-card:hover {
            transform: translateY(-5px) !important;
            background-color: #F1F8F1 !important; /* Açık yeşil arkaplan */
            border-left-color: #4C9A2A !important; /* Açık yeşil çizgi */
            box-shadow: 0 10px 20px rgba(76, 154, 42, 0.15) !important; /* Açık yeşil gölge */
        }

        .v-card-name {
            font-weight: 700 !important;
            font-size: 1.1rem !important;
            color: #2C3E50 !important;
            margin-bottom: 8px !important;
            line-height: 1.4 !important;
            transition: color 0.3s ease !important;
        }

        .v-member-card:hover .v-card-name {
            color: #1E5631 !important; /* Yazı rengi koyu yeşile döner */
        }

        .v-card-inst {
            font-size: 0.9rem !important;
            color: #5a6c7d !important;
            display: flex !important;
            align-items: flex-start !important;
            gap: 8px !important;
            font-weight: 500 !important;
            line-height: 1.4 !important;
            margin: 0 !important;
        }

        .v-card-icon {
            width: 16px !important;
            height: 16px !important;
            fill: #4C9A2A !important; /* Açık yeşil ikon */
            flex-shrink: 0 !important;
            margin-top: 3px !important;
        }

        .v-section-note {
            text-align: center;
            color: #5a6c7d;
            font-size: 0.95rem;
            font-style: italic;
            margin-top: 50px;
            margin-bottom: 40px;
        }

        /* Responsive Düzeltmeler */
        @media (max-width: 768px) {
            .v-grid-layout { 
                grid-template-columns: 1fr !important;
            }
            .v-group-title {
                font-size: 1.5rem !important;
            }
        }
    </style>
</head>
